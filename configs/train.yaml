# ==============================================================================
# Training Configuration for BANKING77 Intent Detection
# ==============================================================================
# Model: Qwen2.5-1.5B-Instruct (4-bit quantized via Unsloth)
# Task: Banking intent classification using generative approach
# ==============================================================================

# --- Model Configuration ---
model:
  name: "unsloth/Qwen2.5-1.5B-Instruct-bnb-4bit"
  max_seq_length: 512
  load_in_4bit: true

# --- LoRA Configuration ---
lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"
  use_rslora: false
  loftq_config: null

# --- Training Arguments ---
training:
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 2.0e-4
  optimizer: "adamw_8bit"
  weight_decay: 0.01
  warmup_steps: 10
  lr_scheduler_type: "linear"
  fp16: true
  bf16: false
  logging_steps: 10
  save_strategy: "epoch"
  seed: 42
  group_by_length: true
  max_grad_norm: 0.3

# --- Data Configuration ---
data:
  dataset_name: "PolyAI/banking77"
  num_intents: 30           # Number of intents to sample (out of 77)
  test_size: 0.2            # Train/test split ratio
  random_state: 42
  train_path: "sample_data/train.csv"
  test_path: "sample_data/test.csv"

# --- Output Configuration ---
output:
  checkpoint_dir: "checkpoints/banking77-intent"
  log_dir: "logs"
